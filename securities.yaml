  AMT:   {name: American Tower,      type: stock, asset_class: equity, sector: Real Estate,            region: US, cik: 1053507}
  # --- non-US stocks listed in the US (ADRs) ---
  TSM:   {name: Taiwan Semiconductor, type: stock, asset_class: equity, sector: Information Technology, region: Emerging, cik: 1046179}
