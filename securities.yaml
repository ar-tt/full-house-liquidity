  # --- ETFs ---
  VTI:   {name: Vanguard Total US Stock Market,   type: etf, asset_class: equity, sector: Diversified, region: US,              issuer: Vanguard VTI}
  VEA:   {name: Vanguard Developed Markets ex-US, type: etf, asset_class: equity, sector: Diversified, region: Developed ex-US, issuer: Vanguard VEA}
  VWO:   {name: Vanguard Emerging Markets,        type: etf, asset_class: equity, sector: Diversified, region: Emerging,        issuer: Vanguard VWO}
