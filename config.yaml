# Full House Capital — Full House Liquidity quant engine
# Every number, date and switch the engine uses lives in this file.
# Money is in US dollars. Rates are decimals (0.04 = 4%).

meta:
  team: Full House Capital
  thesis: Full House Liquidity
  client: Laura Gao
  year_zero: 2026

# ---------------------------------------------------------------------------
# CASH-FLOW SCHEDULE — one row per movement of money.
#   amount > 0  : money INTO the portfolio (Laura contributes)
#   amount < 0  : money OUT of the portfolio (a residency payment)
#   kind        : what the row is; the reserve funds every row whose kind is
#                 listed in reserve.funds_kinds
# Edit rows here; nothing in the code assumes how many there are.
# ---------------------------------------------------------------------------
cash_flows:
  - {date: 2027-01-01, amount:  300000, kind: contribution,      note: "Initial investment"}
  - {date: 2028-01-01, amount:  150000, kind: contribution,      note: "Second contribution"}
  - {date: 2033-01-01, amount:  -50000, kind: residency_payment, note: "Residency payment 1 of 10"}
  - {date: 2034-01-01, amount:  -50000, kind: residency_payment, note: "Residency payment 2 of 10"}
  - {date: 2035-01-01, amount:  -50000, kind: residency_payment, note: "Residency payment 3 of 10"}
  - {date: 2036-01-01, amount:  -50000, kind: residency_payment, note: "Residency payment 4 of 10"}
  - {date: 2037-01-01, amount:  -50000, kind: residency_payment, note: "Residency payment 5 of 10"}
  - {date: 2038-01-01, amount:  -50000, kind: residency_payment, note: "Residency payment 6 of 10"}
  - {date: 2039-01-01, amount:  -50000, kind: residency_payment, note: "Residency payment 7 of 10"}
  - {date: 2040-01-01, amount:  -50000, kind: residency_payment, note: "Residency payment 8 of 10"}
  - {date: 2041-01-01, amount:  -50000, kind: residency_payment, note: "Residency payment 9 of 10"}
  - {date: 2042-01-01, amount:  -50000, kind: residency_payment, note: "Residency payment 10 of 10"}

# Dates on which a decision (not a fixed cash flow) happens.
decision_dates:
  cosponsor_quote: 2031-01-01        # Laura quotes co-sponsors a range
  reserve_carve_out: 2033-01-01      # operating reserve set aside
  facility_contribution: 2033-01-01  # facility gets what remains

# ---------------------------------------------------------------------------
# OPERATING RESERVE — a ladder of zero-coupon US Treasuries (STRIPS).
# One "rung" per payment: a bond that pays exactly the payment amount on
# (or just before) the payment date. Nominal, not TIPS, because payments
# are fixed dollars.
# ---------------------------------------------------------------------------
reserve:
  funds_kinds: [residency_payment]
  # How to price the ladder on the carve-out date:
  #   flat           : one interest rate for every rung (flat_rate below)
  #   curve_spot     : assume the 2033 yield curve looks like the latest real one
  #   curve_forward  : the 2033 cost implied by today's market (lockable today)
  pricing: flat
  flat_rate: 0.04
  compounding: annual          # annual | semiannual | continuous (for flat rates)
  scenario_rates: [0.03, 0.04, 0.05]
  # Maturity buckets for "what is the reserve made of", in years to maturity.
  maturity_buckets:
    - {label: "Paid today (cash)", max_years: 0}
    - {label: "Under 1 year",      max_years: 1}
    - {label: "1-5 years",         max_years: 5}
    - {label: "5-10 years",        max_years: 10}

# ---------------------------------------------------------------------------
# DETERMINISTIC PROJECTION — a single "what if returns are exactly X" path.
# The Monte Carlo (step 5) replaces this with thousands of random paths,
# using the same engine.
# ---------------------------------------------------------------------------
projection:
  growth_rate: 0.07
  scenario_growth_rates: [0.05, 0.07, 0.09]

# ---------------------------------------------------------------------------
# DATA SOURCES (free tier)
# ---------------------------------------------------------------------------
data:
  cache_dir: data/cache
  cache_max_age_days: 1
  request_timeout_seconds: 60
  treasury_curve:
    # Federal Reserve Gürkaynak-Sack-Wright zero-coupon curve (free, daily).
    url: https://www.federalreserve.gov/data/yield-curve-tables/feds200628.csv
    filename: feds200628.csv

# ===========================================================================
# PILLARS — each one is a file in fhl/pillars/ plus one line here.
# To add a fourth pillar (e.g. EDGE), write fhl/pillars/edge.py and add a line.
#   structural: true  -> runs FIRST; if it blocks, the others never run
#   enabled: false    -> skipped (the file doesn't have to exist yet)
# ===========================================================================
pillars:
  - {name: range,       module: "fhl.pillars.range_table:RangeTable",         weight: 50, structural: true,  enabled: true}
  - {name: convergence, module: "fhl.pillars.convergence:ConvergenceEngine",  weight: 25, structural: false, enabled: true}
  - {name: position,    module: "fhl.pillars.position_clock:PositionClock",   weight: 25, structural: false, enabled: true}

# How pillar scores become one number.
#   geometric : scores MULTIPLY (weighted by `weight`), so a poor Range score
#               drags everything down and can't be offset by a great stock
#   gate_then_weighted : Range only blocks or passes; the other pillars are
#               averaged by weight and the Range score is reported, not used
#               (chosen by the team). If no scoring pillar has an opinion on a
#               security (e.g. an ETF before the Position Clock exists), a
#               trade that passed every rule goes ahead.
combine:
  method: gate_then_weighted
  min_score_to_act: 60        # below this, a buy that passed every rule is still "hold off"

# ===========================================================================
# THE RANGE TABLE — portfolio structure rules
# ===========================================================================
securities_file: securities.yaml
portfolio_file: portfolio.yaml

range_table:
  cap_base: total             # caps are shares of the whole portfolio incl. cash
  asset_classes: [equity, bond, cash]
  regions: [US, Developed ex-US, Emerging]
  us_region: US
  sectors: [Communication Services, Consumer Discretionary, Consumer Staples, Energy,
            Financials, Health Care, Industrials, Information Technology, Materials,
            Real Estate, Utilities, Government, Diversified]

  # Hard caps (an order that breaks one is blocked)
  single_name_cap: 0.05       # any one company
  etf_cap: 0.25               # any one ETF (a fund holds hundreds of companies)
  name_cap_exempt_issuers: [US Treasury]
  sector_cap: 0.20
  sector_cap_asset_classes: [equity]   # Treasuries are not a "sector bet"
  sector_cap_exempt: [Diversified]     # broad-market ETFs; capped by etf_cap instead
  non_us_cap: 0.25

  # Budgets: [min, max] share of the portfolio. Max is a hard stop for buys;
  # min only produces a warning. With equity_max_from_wind_down on, the
  # growth asset classes' max is replaced by the wind-down ceiling for the date.
  equity_max_from_wind_down: true
  asset_class_budgets:
    equity: [0.00, 0.90]
    bond:   [0.00, 1.00]
    cash:   [0.00, 1.00]
  region_budgets:
    US:              [0.60, 1.00]
    Developed ex-US: [0.00, 0.20]
    Emerging:        [0.00, 0.10]

  # Correlation (computed from daily closing prices, never downloaded ready-made)
  correlation:
    window_days: 60             # trading days of returns
    max_avg_pairwise: 0.60      # block buys that push the average above this
    good_avg_pairwise: 0.30     # at or below this, the correlation score is 100
    averaging: weighted         # weighted (by position size) | equal
    asset_classes: [equity]     # measured on the growth holdings only
    missing_history: block      # block | warn when a buy lacks 60 days of prices

  # Effective number of bets, from the correlation matrix eigenvalues
  bets:
    method: entropy             # entropy | participation
    good: 15                    # at or above this, the bets score is 100
    floor: 3                    # at or below this, the bets score is 0

  positions:
    count_asset_classes: [equity]
    target: [25, 35]
    hard_max: 35                # a buy of a NEW name above this is blocked
    soft_band: 15               # score falls to 0 this many names outside the target

  headroom:                     # how close the fullest cap is to its limit
    full_score_below: 0.50      # using under half of every cap = 100
    zero_score_at: 1.00         # sitting at a cap = 0

  score_weights:                # how the Range score (0-100) is built
    correlation: 0.35
    bets: 0.35
    headroom: 0.20
    positions: 0.10

prices:
  source: yahoo_chart
  url: "https://query1.finance.yahoo.com/v8/finance/chart/{ticker}?period1={start}&period2={end}&interval=1d&events=div%2Csplit"
  history_start: 2010-01-01   # 10+ years for valuation ranges and dividend streaks
  cache_subdir: prices

# ===========================================================================
# FUNDAMENTALS — raw numbers from company filings (SEC EDGAR, free)
# Each metric lists alternatives. Per fiscal year, the first alternative whose
# FIRST tag was filed wins; any other tags in it are added if present (e.g.
# long-term debt + commercial paper). Companies switch tags over the years,
# so this is checked year by year, never once per company.
# ===========================================================================
fundamentals:
  edgar_url: "https://data.sec.gov/api/xbrl/companyfacts/CIK{cik:010d}.json"
  # The SEC asks automated users to identify themselves with a contact email.
  # Put yours in config.local.yaml (kept out of git), not here:
  #   fundamentals:
  #     user_agent: "Full House Capital WGHSIC quant engine you@example.com"
  # Without it, sec.gov refuses some requests (the company ticker list).
  user_agent: "Full House Capital WGHSIC quant engine [add contact email in config.local.yaml]"
  cache_subdir: edgar
  cache_max_age_days: 7
  seconds_between_requests: 0.2        # SEC limit is 10 requests/second
  annual_forms: [10-K, 10-K/A, 20-F, 20-F/A, 40-F, 40-F/A]
  annual_days: [350, 380]              # a fiscal year is 350-380 days long
  year_end_tolerance_days: 10
  # Missing = zero only where a missing tag really means "none" (no debt, no
  # interest, no short-term investments). NOT dividends: some payers don't tag
  # the amount, and "zero" would wrongly call them non-payers.
  default_zero: [total_debt, interest_expense, short_term_investments]
  latest_shares_max_age_days: 400      # share counts older than this are skipped for today's value
  concepts:
    revenue:
      money: true
      alternatives:
        - [us-gaap:Revenues]
        - [us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax]
        - [us-gaap:RevenueFromContractWithCustomerIncludingAssessedTax]
        - [us-gaap:SalesRevenueNet]
        - [us-gaap:SalesRevenueGoodsNet]
        - [us-gaap:RegulatedAndUnregulatedOperatingRevenue]
        - [ifrs-full:Revenue]
    operating_income:
      money: true
      alternatives:
        - [us-gaap:OperatingIncomeLoss]
        - [ifrs-full:ProfitLossFromOperatingActivities]
    pretax_income:
      money: true
      alternatives:
        - [us-gaap:IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest]
        - [us-gaap:IncomeLossFromContinuingOperationsBeforeIncomeTaxesMinorityInterestAndIncomeLossFromEquityMethodInvestments]
        - [us-gaap:IncomeLossFromContinuingOperationsBeforeIncomeTaxesDomestic, us-gaap:IncomeLossFromContinuingOperationsBeforeIncomeTaxesForeign]
        - [ifrs-full:ProfitLossBeforeTax]
    income_tax:
      money: true
      alternatives:
        - [us-gaap:IncomeTaxExpenseBenefit]
        - [ifrs-full:IncomeTaxExpenseContinuingOperations]
    net_income:
      money: true
      alternatives:
        - [us-gaap:NetIncomeLoss]
        - [us-gaap:ProfitLoss]
        - [ifrs-full:ProfitLossAttributableToOwnersOfParent]
        - [ifrs-full:ProfitLoss]
    eps_diluted:
      per_share: true
      alternatives:
        - [us-gaap:EarningsPerShareDiluted]
        - [ifrs-full:DilutedEarningsLossPerShare]
    diluted_shares:
      shares: true
      alternatives:
        - [us-gaap:WeightedAverageNumberOfDilutedSharesOutstanding]
        - [ifrs-full:WeightedAverageNumberOfSharesOutstandingDiluted]
        - [ifrs-full:AdjustedWeightedAverageShares]
        - [us-gaap:WeightedAverageNumberOfSharesOutstandingBasic]   # when no diluted count is filed
    operating_cash_flow:
      money: true
      alternatives:
        - [us-gaap:NetCashProvidedByUsedInOperatingActivities]
        - [us-gaap:NetCashProvidedByUsedInOperatingActivitiesContinuingOperations]
        - [ifrs-full:CashFlowsFromUsedInOperatingActivities]
    capex:
      money: true
      alternatives:
        - [us-gaap:PaymentsToAcquirePropertyPlantAndEquipment]
        - [us-gaap:PaymentsToAcquireProductiveAssets]
        - [ifrs-full:PurchaseOfPropertyPlantAndEquipmentClassifiedAsInvestingActivities]
    depreciation_amortization:
      money: true
      alternatives:
        - [us-gaap:DepreciationDepletionAndAmortization]
        - [us-gaap:DepreciationAmortizationAndAccretionNet]
        - [us-gaap:DepreciationAndAmortization]
        - [us-gaap:Depreciation, us-gaap:AmortizationOfIntangibleAssets]
        - [ifrs-full:DepreciationAndAmortisationExpense]
    dividends_paid:
      money: true
      alternatives:
        - [us-gaap:PaymentsOfDividendsCommonStock]
        - [us-gaap:PaymentsOfDividends]
        - [us-gaap:PaymentsOfOrdinaryDividends]
        - [ifrs-full:DividendsPaidClassifiedAsFinancingActivities]
        - [ifrs-full:DividendsPaid]
    interest_expense:
      money: true
      alternatives:
        - [us-gaap:InterestExpense]
        - [us-gaap:InterestExpenseNonoperating]
        - [us-gaap:InterestExpenseDebt]
        - [ifrs-full:InterestExpense]
    total_assets:
      money: true
      instant: true
      alternatives:
        - [us-gaap:Assets]
        - [ifrs-full:Assets]
    equity:
      money: true
      instant: true
      alternatives:
        - [us-gaap:StockholdersEquity]
        - [us-gaap:StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest]
        - [ifrs-full:EquityAttributableToOwnersOfParent]
        - [ifrs-full:Equity]
    cash:
      money: true
      instant: true
      alternatives:
        - [us-gaap:CashAndCashEquivalentsAtCarryingValue]
        - [us-gaap:CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents]
        - [us-gaap:Cash]
        - [ifrs-full:CashAndCashEquivalents]
    short_term_investments:
      money: true
      instant: true
      alternatives:
        - [us-gaap:ShortTermInvestments]
        - [us-gaap:MarketableSecuritiesCurrent]
        - [us-gaap:AvailableForSaleSecuritiesDebtSecuritiesCurrent]
        - [ifrs-full:CurrentInvestments]
    total_debt:
      money: true
      instant: true
      alternatives:
        - [us-gaap:LongTermDebtAndCapitalLeaseObligationsIncludingCurrentMaturities, us-gaap:CommercialPaper, us-gaap:ShortTermBorrowings, us-gaap:OtherShortTermBorrowings]
        - [us-gaap:LongTermDebtAndCapitalLeaseObligations, us-gaap:LongTermDebtAndCapitalLeaseObligationsCurrent, us-gaap:CommercialPaper, us-gaap:ShortTermBorrowings, us-gaap:OtherShortTermBorrowings]
        - [us-gaap:LongTermDebt, us-gaap:CommercialPaper, us-gaap:ShortTermBorrowings, us-gaap:OtherShortTermBorrowings]
        - [us-gaap:LongTermDebtNoncurrent, us-gaap:LongTermDebtCurrent, us-gaap:CommercialPaper, us-gaap:ShortTermBorrowings, us-gaap:OtherShortTermBorrowings]
        - [us-gaap:DebtCurrent, us-gaap:LongTermDebtNoncurrent]
        - [ifrs-full:Borrowings]
        - [ifrs-full:NoncurrentPortionOfNoncurrentBorrowings, ifrs-full:CurrentBorrowingsAndCurrentPortionOfNoncurrentBorrowings]

# ===========================================================================
# THE CONVERGENCE ENGINE — is this a business where several return sources
# (quality compounding, a durable dividend, a price below value) agree?
# Each metric maps to 0-100 on a straight line from `worst` (0) to `best` (100).
# ===========================================================================
convergence:
  applies_to_types: [stock]            # ETFs and bonds get "no opinion"
  unsupported_sectors: [Financials]    # bank/insurer accounts don't fit ROIC/FCF/EBITDA
  missing_data: block                  # block | no_opinion when a stock can't be scored
  min_years: 5                         # fewer years of filings = can't score
  max_report_age_days: 550             # latest annual report older than this = can't score (stale)
  history_years: 10                    # "full cycle" / "own 10-year range"
  statutory_tax_rate: 0.21             # used when a year's tax rate can't be computed
  roic_cap: 0.60                       # ROIC above this (or with negative capital) counts as this

  wacc:
    equity_risk_premium: 0.05
    market_proxy: VTI                  # beta is measured against this
    beta_years: 5                      # weekly returns
    beta_shrink_to_one: 0.33           # 0.67 x measured beta + 0.33 x 1 (Blume adjustment)
    beta_bounds: [0.5, 2.5]
    risk_free_maturity_years: 10       # from the Fed Treasury curve on the as-of date
    cost_of_debt_spread_bounds: [0.0, 0.06]   # interest/debt kept within rf + this range
    floor: 0.06
    risk_free_fallback: 0.04           # only if the Fed curve can't be loaded

  dcf:
    years: 10                          # years at the growth rate the business has delivered
    fade_years: 10                     # then growth steps down evenly to terminal over this many years (3C)
    terminal_growth: 0.025             # growth forever after that
    growth_bounds: [0.0, 0.15]         # delivered growth is kept inside this range
    fcf_start: average                 # starting FCF: average (of fcf_average_years) | latest
    fcf_average_years: 3
    reverse_search: [-0.20, 0.50]      # range searched for the price-implied growth

  # What the 25% margin-of-safety rule is measured against.
  valuation:
    margin_of_safety_basis: blended    # dcf | blended (3C: blend using the fade-10 DCF)
    blend_weights:                     # for "blended"; re-weighted over the methods available
      dcf: 0.50                        # the DCF above
      own_ev_ebit: 0.20                # value if EV/EBIT went back to its own 10-yr median
      own_fcf_yield: 0.10              # value if FCF yield went back to its own 10-yr median
      sector_ev_ebit: 0.20             # value at the sector's median EV/EBIT
    blend_min_methods: 2               # fewer methods than this = no blended value

  # What-ifs for `python -m fhl value-compare`. Each sets settings under
  # `convergence` (dotted names), spelled out in full so a version means the
  # same thing whatever the live default is. Nothing here changes a decision.
  valuation_variants:
    - {code: A,  name: "DCF: 10 yrs growth, then 2.5%",          changes: {valuation.margin_of_safety_basis: dcf, dcf.fade_years: 0}}
    - {code: B,  name: "DCF, fade over 5 yrs",                    changes: {valuation.margin_of_safety_basis: dcf, dcf.fade_years: 5}}
    - {code: C,  name: "DCF, fade over 10 yrs",                   changes: {valuation.margin_of_safety_basis: dcf, dcf.fade_years: 10}}
    - {code: D,  name: "DCF, fade 10 yrs, latest-year FCF",       changes: {valuation.margin_of_safety_basis: dcf, dcf.fade_years: 10, dcf.fcf_start: latest}}
    - {code: E,  name: "DCF, fade 10 yrs, growth cap 20%",        changes: {valuation.margin_of_safety_basis: dcf, dcf.fade_years: 10, dcf.growth_bounds: [0.0, 0.20]}}
    - {code: "3",  name: "Blend with the no-fade DCF",            changes: {valuation.margin_of_safety_basis: blended, dcf.fade_years: 0}}
    - {code: "3C", name: "Blend with the fade-10 DCF (DEFAULT)",  changes: {valuation.margin_of_safety_basis: blended, dcf.fade_years: 10}}

  sources:                             # the three return sources and their weights
    quality:  {weight: 0.40}
    dividend: {weight: 0.20}
    value:    {weight: 0.40}
  non_payer_dividend: skip             # skip | zero (a company that pays no dividend)
  min_metrics_per_source: 2
  min_sources_scored: 2                # fewer than this = can't score the business
  agree_threshold: 60                  # a source "points the way" at or above this
  agreement_floor: 0.60                # final = average x (floor + (1-floor) x share agreeing)

  metrics:
    quality:
      roic_spread:        {weight: 0.25, best: 0.10,  worst: -0.02}  # median ROIC - WACC
      roic_consistency:   {weight: 0.15, best: 1.00,  worst: 0.50}   # share of years ROIC > WACC
      fcf_margin:         {weight: 0.15, best: 0.20,  worst: 0.00}
      revenue_growth:     {weight: 0.15, best: 0.10,  worst: 0.00}   # full-cycle, per year
      eps_growth:         {weight: 0.10, best: 0.12,  worst: 0.00}
      net_debt_to_ebitda: {weight: 0.10, best: 1.00,  worst: 3.00}
      accrual_ratio:      {weight: 0.10, best: -0.05, worst: 0.10}
    dividend:
      growth_streak:      {weight: 0.40, best: 10,    worst: 0}      # years of rising dividends
      payout_ratio:       {weight: 0.30, best: 0.40,  worst: 0.60}
      fcf_coverage:       {weight: 0.30, best: 2.50,  worst: 1.50}
    value:
      reverse_dcf_gap:    {weight: 0.30, best: 0.05,  worst: -0.05}  # delivered - implied growth
      margin_of_safety:   {weight: 0.30, best: 0.40,  worst: 0.00}
      fcf_yield_vs_own:   {weight: 0.15, best: 1.00,  worst: 0.00}   # 1 = cheapest in 10 years
      ev_ebit_vs_own:     {weight: 0.15, best: 0.00,  worst: 1.00}   # 0 = cheapest in 10 years
      ev_ebit_vs_sector:  {weight: 0.10, best: 0.70,  worst: 1.30}   # own / sector median

  hard_rules:
    min_margin_of_safety: 0.25         # buys below this are blocked
    margin_of_safety_unknown: block    # block | warn when it can't be measured
    max_net_debt_to_ebitda: null       # set a number to make leverage a hard stop too

# ===========================================================================
# THE POSITION CLOCK — WHEN to buy, never WHAT (that is Range + Convergence)
# ===========================================================================

# LONG HAND: the wind-down from growth assets to the Treasury reserve.
wind_down:
  growth_asset_classes: [equity]
  # Calendar, one row per step. From each date on, the growth share must stay
  # inside [low, high]. HIGH IS A HARD CEILING: the Range Table blocks any buy
  # above it. Funded status (below) decides where inside the band to sit, and
  # can go BELOW the band to protect the reserve; it can never go above it.
  schedule:
    - {from: 2026-01-01, growth: [0.85, 0.90]}
    - {from: 2030-01-01, growth: [0.70, 0.80]}
    - {from: 2032-01-01, growth: [0.50, 0.60]}
    - {from: 2033-01-01, growth: [0.00, 0.00]}   # reserve carved out; the rest goes to the facility
  # Projected funded status = portfolio value projected to the carve-out date
  # (following the calendar, at the expected returns below, plus promised
  # contributions) / what the reserve is projected to cost on that date.
  expected_return_growth: 0.07
  expected_return_safe: 0.045
  funded_status:
    behind_below: 1.30         # at or below: stay at the ceiling ("more time in equities, never leverage")
    lock_in_above: 1.90        # at or above: lock the whole reserve in Treasuries now
  # Share of the reserve's lock-in cost (what the remaining payments cost in
  # Treasuries today) that must ALREADY be in Treasuries from each date, so no
  # growth asset has to be sold in a drawdown at the carve-out. Waived when
  # even an all-Treasury portfolio couldn't cover it (that would lock in a shortfall).
  # FULL RAMP (team decision after step 5): the whole reserve is in Treasuries
  # by 2032, so the carve-out never needs a stock sale. The softened ramp
  # (25/45/75%) secured the payments on only 70% of simulated paths.
  hedge_ramp:
    - {from: 2030-01-01, share: 0.33}
    - {from: 2031-01-01, share: 0.67}
    - {from: 2032-01-01, share: 1.00}
  # Risk dial: the growth share actually held = the target from the rules
  # above x this. 0.75 = the most facility money that still clears the 95%
  # certainty test in step 5 (98.4% of paths). It can take growth below the
  # calendar band; it never raises it above the ceiling.
  risk_dial: 0.75
  rebalance_tolerance: 0.02    # within +/- 2 points of target counts as on target

# SHORT HAND: timing and size of each entry into a position.
position_clock:
  applies_to_types: [stock, etf]    # bonds follow the ladder, not the clock
  indicators:
    trend_ma_days: 200
    adx_days: 14
    adx_trending_above: 20
    rsi_days: 14
    rsi_accelerate_below: 40
    rsi_delay_above: 70
    vol_days: 60
  # The regime sets the pace: 3 tranches spaced this many weeks apart
  # (2 weeks = in over 4 weeks, 4 weeks = in over 8 weeks), and a timing score.
  regimes:
    uptrend:   {spacing_weeks: 2, score: 80}   # price above its 200-day average and ADX > 20
    no_trend:  {spacing_weeks: 3, score: 65}   # ADX at or below 20
    downtrend: {spacing_weeks: 4, score: 45}   # price below its 200-day average and ADX > 20
  tranches: 3
  max_window_weeks: 8          # every tranche is in by then, whatever RSI says
  accelerate_weeks: 1          # RSI under 40 pulls the next tranche forward this much
  rsi_score_adjust: {accelerate: 15, delay: -25}
  # Full position size = base_weight x (reference_vol / the stock's 60-day
  # volatility), kept inside weight_bounds; shares of the whole portfolio.
  sizing:
    stock: {base_weight: 0.035, reference_vol: 0.25, weight_bounds: [0.01, 0.05]}
    etf:   {base_weight: 0.15,  reference_vol: 0.16, weight_bounds: [0.02, 0.25]}
  size_tolerance: 0.10         # an order up to 10% above the tranche size is fine

# ===========================================================================
# RISK CONTROLS — hard limits. The simulation below obeys them month by month.
# ===========================================================================
risk_controls:
  # The portfolio's volatility (growth share x growth-asset volatility) may
  # not exceed this: 12% through 2029, stepping down to 8% by 2032.
  vol_target:
    - {from: 2026-01-01, vol: 0.12}
    - {from: 2030-01-01, vol: 0.1067}
    - {from: 2031-01-01, vol: 0.0933}
    - {from: 2032-01-01, vol: 0.08}
  vol_lookback_months: 12      # growth-asset volatility measured over the last 12 months
  drawdown_trigger: 0.20       # portfolio 20% below its peak ...
  drawdown_growth_cap: 0.50    # ... caps growth at 50% until it is back at the peak
  turnover_cap: 0.50           # at most 50% of the portfolio traded in any 12 months
  liquidity: {adv_share: 0.10, days: 3}   # order-level: exitable in 3 days at 10% of volume

# ===========================================================================
# MONTE CARLO — certainty test and the 2031 range
# ===========================================================================
monte_carlo:
  paths: 10000
  seed: 2026                   # same seed = same answer every run
  start: 2027-01-01            # Laura's first contribution
  certainty_threshold: 0.95    # "high degree of certainty"
  thresholds_to_compare: [0.90, 0.95, 0.99]
  # A path SUCCEEDS if, on the carve-out date, the portfolio covers the whole
  # reserve AND buying the part of the ladder not already owned does not
  # require selling growth assets while they are this far below their peak.
  forced_sale_drawdown: 0.10
  quote:
    date: 2031-01-01           # when Laura quotes co-sponsors
    floor_percentile: 20
    ceiling_percentile: 70
  growth_returns:
    model: bootstrap           # bootstrap (real history) | lognormal (bell curve)
    series: VTI                # monthly total returns, dividends included, from daily prices
    history_start: 2001-06-15
    cache_subdir: prices_long
    block_months: 12           # replay 12-month runs of history so crashes stay crashes
    median_annual_return: 0.07 # history re-centred so the typical year is +7%
    lognormal_vol: 0.16        # only for model: lognormal
  rates:                       # one Treasury yield for all maturities, drifting randomly
    start: from_curve          # today's 10-year Fed zero rate, or a number like 0.045
    start_maturity_years: 10
    long_run: 0.045
    pull_per_year: 0.15        # how quickly rates drift back toward the long-run level
    vol_per_year: 0.010        # typical yearly move of 1 percentage point
    floor: 0.0
  # Policies compared in the certainty menu. Each changes settings (dotted names
  # from the top of this file), and each is run at every risk dial below
  # (it replaces wind_down.risk_dial: 1.0 = as designed, 0 = no growth assets).
  # The live settings are simulated separately, as they are in this file.
  policies:
    - {code: F, name: "Full hedge ramp (100% by 2032)", changes: {wind_down.hedge_ramp: [{from: 2030-01-01, share: 0.33}, {from: 2031-01-01, share: 0.67}, {from: 2032-01-01, share: 1.0}]}}
    - {code: S, name: "Softened ramp (75% by 2032)",    changes: {wind_down.hedge_ramp: [{from: 2030-01-01, share: 0.25}, {from: 2031-01-01, share: 0.45}, {from: 2032-01-01, share: 0.75}]}}
    - {code: L, name: "Lock in the reserve from day one", changes: {wind_down.hedge_ramp: [{from: 2026-01-01, share: 1.0}]}}
    - {code: N, name: "No hedge ramp",                  changes: {wind_down.hedge_ramp: []}}
  risk_dials: [1.0, 0.75, 0.5, 0.25, 0.0]

# ===========================================================================
# BACKTEST — Laura's plan replayed through real history
# ===========================================================================
backtest:
  # Stocks: an S&P 500 index fund, total return from its daily prices
  # (dividends added back). An index has no survivor bias.
  series: VFINX
  history_start: 1980-01-01
  cache_subdir: prices_backtest
  # Cash earns the 3-month Treasury rate from the Fed curve on the first of
  # each month (FRED blocks automated downloads without an API key).
  bill_maturity_years: 0.25
  # Treasury ladder: the Fed zero-coupon curve on each date. It is reliable
  # out to about 20 years from 1981, so the first window starts then.
  first_start: 1981-01-01
  # Quote check: in each window, the 2031-style quote is made from what was
  # known at the time, then compared with what actually happened.
  calibration:
    paths_per_window: 1000
    growth_model: lognormal    # assumptions only, no later history (no look-ahead)
  # Backtest 2: Position Clock entry timing vs buying all at once, on index ETFs
  # (no survivor bias). Decision each trading day; signals from the day before.
  clock:
    series: [SPY, QQQ, IWM, EFA, EEM]
    horizons_days: [63, 252]           # judge each entry 3 and 12 months after the decision
    naive_spacing_weeks: 3             # the "plain thirds" comparison
  # Backtest 3: do the Range Table's rules predict smaller losses? Sector ETFs
  # (no survivor bias) plus the starter stocks for the correlation question.
  range:
    sector_etfs: [XLB, XLE, XLF, XLI, XLK, XLP, XLU, XLV, XLY]
    random_portfolios: 400             # random mixes of the sector ETFs, each month
    dirichlet_alpha: 0.6               # lower = more lopsided random mixes
    weight_bins: [0.20, 0.40]          # biggest sector <=20% (within the cap), 20-40%, >40%
    forward_days: 252                  # judge each month by the following 12 months
    seed: 11
  # Backtest 4: do higher Convergence scores come before better returns?
  # BIASED (see the report): free prices mostly lack companies that were later
  # taken over or delisted. The stock list itself is chosen point-in-time.
  convergence:
    universe_year: 2013                # the biggest US companies by revenue that year...
    universe_size: 150                 # ...this many, after removing financials
    candidates: 260                    # how many to look at before removing financials
    revenue_tags: [Revenues, SalesRevenueNet, SalesRevenueGoodsNet]
    # Only companies with publicly held shares: more than this many common
    # shares on their cover page early the next year. Removes wholly owned
    # subsidiaries that file only because of their bonds, and companies that
    # didn't exist yet (their year's revenue appears only in later restatements).
    shares_url: "https://data.sec.gov/api/xbrl/frames/dei/EntityCommonStockSharesOutstanding/shares/CY{year}Q1I.json"
    min_shares: 1000000
    company_list_url: "https://www.sec.gov/files/company_tickers.json"
    frames_url: "https://data.sec.gov/api/xbrl/frames/us-gaap/{tag}/USD/CY{year}.json"
    submissions_url: "https://data.sec.gov/submissions/CIK{cik:010d}.json"
    rebalance: {month: 4, day: 1}      # each April 1, after the annual reports are out
    first_year: 2015                   # first year with 5+ years of tagged filings
    last_year: 2025
    forward_days: 365                  # judge each score by the next 12 months' total return
    groups: 3                          # thirds: top, middle, bottom
    # SIC industry code ranges -> sector (first match wins). An approximation
    # of the GICS sectors used elsewhere; SIC is the SEC's own classification.
    sic_sectors:
      - [1311, 1389, Energy]
      - [2900, 2999, Energy]
      - [4610, 4619, Energy]
      - [2830, 2836, Health Care]
      - [3841, 3851, Health Care]
